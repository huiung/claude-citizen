<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ship Studio</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { font-family: "Share Tech Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #studio-root { position: fixed; inset: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    #studio-label {
      position: fixed; left: 24px; top: 20px; pointer-events: none;
      color: #9fffb0; font-size: 13px; letter-spacing: 1.6px; opacity: .82;
      text-shadow: 0 0 8px rgba(0, 0, 0, .9);
    }
  </style>
</head>
<body>
  <div id="studio-root"></div>
  <!-- Params are documented at the top of src/social/shipStudio.ts. Deterministic: nothing animates. -->
  <div id="studio-label"></div>
  <script type="module" src="/src/social/shipStudio.ts"></script>
</body>
</html>
